  .scc-extra-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
  .scc-extra-item{border:1px solid #dbeafe;background:#f8fbff;border-radius:18px;padding:16px;display:flex;flex-direction:column;min-height:155px}
  .scc-extra-item strong{font-size:16px;color:#1E3A8A;margin-bottom:6px}
  .scc-extra-item span{font-size:13px;line-height:1.4;color:#475569;flex:1}
  .scc-extra-item button,.scc-extra-link{margin-top:12px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:#1E3A8A;color:#fff;padding:10px 13px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none}
  #scc-extra-zip{width:150px;max-width:100%;border:2px solid #bfdbfe;border-radius:999px;padding:10px 14px;font-weight:800;font-size:16px;outline:none}
  .scc-funeral-card{background:linear-gradient(135deg,#f0fdf4,#fffbeb);border:2px solid #86efac}
  .scc-funeral-card .scc-extra-link{background:#166534}
  @media(max-width:900px){.scc-extra-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:560px){#scc-language-tab{top:82px;right:7px}.scc-extra-grid{grid-template-columns:1fr}.scc-extra-card{padding:18px}.scc-extra-card h2{font-size:24px}}
  .goog-te-banner-frame.skiptranslate{display:none!important}body{top:0!important}#google_translate_element{display:none!important}
</style>
<div id="google_translate_element" aria-hidden="true"></div>
<div id="scc-language-tab" aria-label="Language selector">
  <button type="button" id="scc-lang-en" class="active" aria-label="View in English">EN</button>
  <button type="button" id="scc-lang-es" aria-label="Ver en español">ES</button>
</div>
<script>
function googleTranslateElementInit(){
  try{new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'es',autoDisplay:false},'google_translate_element');}catch(e){}
}
(function(){
  var preferred=localStorage.getItem('sccLanguage')||'en';
  var en=document.getElementById('scc-lang-en'), es=document.getElementById('scc-lang-es');
  function mark(lang){en.classList.toggle('active',lang==='en');es.classList.toggle('active',lang==='es');}
  function setEnglish(){
    localStorage.setItem('sccLanguage','en');mark('en');
    document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain='+location.hostname+';';
    location.reload();
  }
  function setSpanish(){
    localStorage.setItem('sccLanguage','es');mark('es');
    var tries=0;
    (function go(){
      var combo=document.querySelector('.goog-te-combo');
      if(combo){combo.value='es';combo.dispatchEvent(new Event('change'));return;}
      if(tries++<30)setTimeout(go,250);
    })();
  }
  en.addEventListener('click',setEnglish);es.addEventListener('click',setSpanish);
  if(preferred==='es'){mark('es');setTimeout(setSpanish,900);}else mark('en');

  function openSearch(kind){
    var input=document.getElementById('scc-extra-zip');
    var zip=(input&&input.value.match(/^\d{5}$/))?input.value:'07030';
    localStorage.setItem('sccExtraZip',zip);
    var urls={
      medical:'https://www.medicare.gov/care-compare/',
      dme:'https://www.medicare.gov/medical-equipment-suppliers/results?location='+encodeURIComponent(zip),
      glasses:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('eyeglasses optical center senior '+zip),
      rides:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('senior transportation medical rides '+zip),
      grocery:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('senior grocery delivery '+zip),
      bingo:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('senior center bingo '+zip),
      casino:'https://www.google.com/search?q='+encodeURIComponent('senior casino bus trips pickup '+zip),
      events:'https://www.google.com/search?q='+encodeURIComponent('senior events calendar '+zip)
    };
    window.open(urls[kind], '_blank', 'noopener');
  }
  window.sccOpenSeniorSearch=openSearch;

  function addEnhancements(){
    var footer=document.querySelector('footer');
    if(!footer || document.getElementById('scc-extra-wrap')){if(!footer)setTimeout(addEnhancements,350);return;}
    var wrap=document.createElement('div');wrap.id='scc-extra-wrap';
    wrap.innerHTML=`
      <section class="scc-extra-card scc-funeral-card" id="funeral-guide-link">
        <h2>When a Loved One Passes</h2>
        <p>A separate, compassionate guide for families covering first steps, funeral choices, consumer rights, financial help, veterans resources, and grief support. This guide is family guidance and is separate from the living tribute to our Mom.</p>
        <a class="scc-extra-link" href="funeral.html">Open Funeral & Bereavement Guide</a>
      </section>
      <section class="scc-extra-card" id="senior-services-events">
        <h2>Senior Services & Local Activities</h2>
        <p>Enter a ZIP code to open nearby searches for medical care, Medicare equipment, eyeglasses, transportation, grocery help, activities, and local events.</p>
        <label for="scc-extra-zip" style="font-weight:800;color:#1E3A8A">ZIP code</label><br>
        <input id="scc-extra-zip" inputmode="numeric" maxlength="5" value="${localStorage.getItem('sccExtraZip')||'07030'}" aria-label="ZIP code for additional senior services">
        <div class="scc-extra-grid">
          <div class="scc-extra-item"><strong>🏥 Medical Care Facilities</strong><span>Use Medicare Care Compare to find and compare hospitals, doctors, nursing homes, home health, hospice, and other providers.</span><button onclick="sccOpenSeniorSearch('medical')">Find Care</button></div>
          <div class="scc-extra-item"><strong>🦽 Medicare Equipment</strong><span>Search Medicare-enrolled suppliers for wheelchairs, walkers, oxygen, hospital beds, CPAP supplies, and other DME.</span><button onclick="sccOpenSeniorSearch('dme')">Find Equipment</button></div>
          <div class="scc-extra-item"><strong>👓 Eyeglasses & Optical</strong><span>Find nearby optical centers, eyeglasses, vision services, and stores serving older adults.</span><button onclick="sccOpenSeniorSearch('glasses')">Find Optical Care</button></div>
          <div class="scc-extra-item"><strong>🚐 Senior Transportation</strong><span>Search for medical rides, senior shuttles, paratransit, and local transportation assistance.</span><button onclick="sccOpenSeniorSearch('rides')">Find a Ride</button></div>
          <div class="scc-extra-item"><strong>🛒 Grocery & Delivery Help</strong><span>Find nearby grocery delivery and senior-friendly shopping help. The site also links to Meals on Wheels and 211.</span><button onclick="sccOpenSeniorSearch('grocery')">Find Grocery Help</button></div>
          <div class="scc-extra-item"><strong>🎱 Bingo & Senior Centers</strong><span>Find senior centers, bingo activities, social programs, classes, and community recreation.</span><button onclick="sccOpenSeniorSearch('bingo')">Find Activities</button></div>
          <div class="scc-extra-item"><strong>🚌 Casino Trips & Pickups</strong><span>Search local senior-oriented casino bus trips, pickup announcements, and organized excursions. Confirm cost, accessibility, and pickup details directly.</span><button onclick="sccOpenSeniorSearch('casino')">Search Trips</button></div>
          <div class="scc-extra-item"><strong>📅 Local Senior Events</strong><span>Search for local senior events, health fairs, workshops, social gatherings, and community calendars.</span><button onclick="sccOpenSeniorSearch('events')">View Events</button></div>
        </div>
        <p style="font-size:12px;margin-top:16px"><strong>Safety note:</strong> Search results may include third-party businesses. Always confirm current hours, pricing, accessibility, insurance/Medicare participation, transportation terms, and eligibility directly with the provider.</p>
      </section>`;
    footer.parentNode.insertBefore(wrap,footer);
    var mainZip=document.querySelector('input[aria-label="ZIP code"]');
    var extraZip=document.getElementById('scc-extra-zip');
    if(mainZip && /^\d{5}$/.test(mainZip.value))extraZip.value=mainZip.value;
    if(mainZip)mainZip.addEventListener('input',function(){if(/^\d{5}$/.test(mainZip.value))extraZip.value=mainZip.value;});
  }
  setTimeout(addEnhancements,450);
})();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

</body>
</html>
