<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Senior Care Compass lighthouse logo</title>
  <desc id="desc">A lighthouse with a glowing heart beside the words Senior Care Compass and A Beacon of Hope for Families.</desc>
  <defs>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(45 10)">
    <circle cx="60" cy="25" r="35" fill="url(#heartGlow)" opacity=".7"/>
    <rect x="35" y="40" width="50" height="12" rx="3" fill="#17324d"/>
    <rect x="40" y="20" width="40" height="25" rx="4" fill="#17324d"/>
    <rect x="45" y="25" width="8" height="12" rx="1" fill="#FFFBEB"/>
    <rect x="56" y="25" width="8" height="12" rx="1" fill="#FFFBEB"/>
    <rect x="67" y="25" width="8" height="12" rx="1" fill="#FFFBEB"/>
    <path d="M60 12S48 0 38 8C28 16 40 28 60 40C80 28 92 16 82 8C72 0 60 12 60 12Z" fill="#F59E0B" filter="url(#glow)" stroke="#D97706"/>
    <path d="M30 52L20 130H100L90 52Z" fill="#E8EEF7" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>
    <line x1="28" y1="75" x2="92" y2="75" stroke="#17324d" stroke-width="1.5" opacity=".3"/>
    <line x1="25" y1="100" x2="95" y2="100" stroke="#17324d" stroke-width="1.5" opacity=".3"/>
    <path d="M48 110Q60 105 72 110V130H48Z" fill="#17324d"/>
    <path d="M10 130Q30 125 50 130T90 130T110 130V145H10Z" fill="#3B82F6" opacity=".18"/>
    <path d="M15 135Q35 130 55 135T95 135" fill="none" stroke="#EF4444" stroke-width="2" opacity=".45"/>
  </g>
  <g transform="translate(180 70)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="48" letter-spacing="-1">
      <tspan fill="#17324d">Senior Care</tspan><tspan fill="#B7791F"> Compass</tspan>
    </text>
    <text x="0" y="38" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#64748B" letter-spacing="1.6">UN FARO DE ESPERANZA PARA LAS FAMILIAS</text>
  </g>
</svg>